<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --clr-bg: rgb(209 250 229);
        --clr-text: rgb(15 23 42);
        --theme-bg-clr: rgb(15 23 42);
        --theme-toggle-icon: rgb(15 23 42);
        --theme-toggle-border: rgba(0 0 0 / 0.25);
        --toggle-label-txt: "dark";
      }
      :root:has(input#theme:checked) {
        --clr-txt: white;
        --theme-toggle-light-scale: 1;
        --theme-toggle-dark-scale: 0;
        --theme-toggle-icon: white;
        --theme-toggle-border: rgba(255 255 255 / 0.25);
        --theme-toggle-rotate: 1turn;
        --theme-bg-scale: 1.25;
        --toggle-label-txt: "light";
      }
      body {
        display: grid;
        place-content: center;
        place-items: center;
        gap: 2rem;
        height: 100vh;
        font-family: system-ui;
        font-size: 1rem;
        color: var(--clr-txt);
        background: var(--clr-bg);
      }
      /* hide checkbox */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
      h1 {
        font-size: 1.2rem;
        transition: color 300ms ease-in-out;
      }
      .theme-toggle {
        position: relative;

        padding: 1rem;
        display: grid;
        place-items: center;
        transition: outline 150ms ease-in-out;
        cursor: pointer;
        border-radius: 50%;
        outline: 1px solid var(--theme-toggle-border);
        color: var(--theme-toggle-icon);
      }
      .theme-toggle::before {
        content: var(--toggle-label-txt);
        position: absolute;
        top: 100%;
        left: 50%;
        translate: -50% var(--toggle-label-y, -10px);
        font-size: 0.7rem;
        text-transform: uppercase;
        opacity: var(--toggle-label-opacity, 0);
        transition-property: opacity, translate;
        transition-duration: 150ms;
        transition-timing-function: ease-in-out;
      }
      input#theme:focus-within ~ label,
      .theme-toggle:hover {
        outline-width: 10px;
        --toggle-label-y: 20px;
        --toggle-label-opacity: 1;
      }
      .theme-toggle > svg {
        grid-area: 1/1;
        transition:
          scale 300ms ease-in-out,
          rotate 500ms ease-in-out;
        width: 100%;
        height: 100%;
        scale: var(--theme-toggle-dark-scale, 1);
        rotate: var(--theme-toggle-rotate, 0turn);
      }
      .theme-toggle > svg:first-child {
        scale: var(--theme-toggle-light-scale, 0);
      }
      .theme-toggle svg{
          width: 20px;
      }

      /* mask for dark theme */
      .theme-mask {
        position: fixed;
        display: grid;
        isolation: isolate;
        overflow: hidden;
        inset: 0;
        grid-template-rows: repeat(25, 1fr);
        pointer-events: none;
        z-index: -1;
      }
      /* mask "cells" */
      .theme-mask > div {
        background-color: var(--theme-bg-clr);
        scale: var(--theme-bg-scale, 0);
        transition: all 300ms ease-in-out;
        transition-delay: calc(var(--i) * 10ms);
      }
    </style>
  </head>
  <body>
    <h1>Theme Toggle</h1>

    <!-- theme toggle -->
    <input class="peer sr-only" id="theme" type="checkbox" />

    <label for="theme" class="theme-toggle" data-light="light" data-dark="dark">
      <svg
        id="light"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
        <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path>
        <path
          d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"
        ></path>
      </svg>

      <svg
        id="dark"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
        <path
          d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"
        ></path>
      </svg>
    </label>
    <!--theme bg -->
    <div class="theme-mask">
      <div style="--i: 0"></div>
      <div style="--i: 1"></div>
      <div style="--i: 2"></div>
      <div style="--i: 3"></div>
      <div style="--i: 4"></div>
      <div style="--i: 5"></div>
      <div style="--i: 6"></div>
      <div style="--i: 7"></div>
      <div style="--i: 8"></div>
      <div style="--i: 9"></div>
      <div style="--i: 10"></div>
      <div style="--i: 11"></div>
      <div style="--i: 12"></div>
      <div style="--i: 11"></div>
      <div style="--i: 10"></div>
      <div style="--i: 9"></div>
      <div style="--i: 8"></div>
      <div style="--i: 7"></div>
      <div style="--i: 6"></div>
      <div style="--i: 5"></div>
      <div style="--i: 4"></div>
      <div style="--i: 3"></div>
      <div style="--i: 2"></div>
      <div style="--i: 1"></div>
      <div style="--i: 0"></div>
    </div>
  </body>
</html>

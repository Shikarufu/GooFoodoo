<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="

      <nav class="navbar flex between wrapper">
        <a href="#" class="logo">GooFoodoo</a>

        <!-- desktop meny -->
        <ul class="navlist flex gap-3">
          <li>
            <a href="#">Home</a>
          </li>

          <li>
            <a href="#">Menu</a>
          </li>

          <li>
            <a href="#">Service</a>
          </li>

          <li>
            <a href="#">About us</a>
          </li>

          <li>
            <a href="#">Contacts</a>
          </li>
        </ul>

        <div class="desktop-action flex gap-2">
          <a href="#" class="cart-icon">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-value">0</span>
          </a>

          <a href="#" class="btn">
            Sign in
            &nbsp;
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </a>

          <a href="#" class="hamburger">
            <i class="fa-solid fa-bars"></i>
          </a>
        </div>

        <!-- mobile menu -->
         <ul class="mobile-menu">
          <li>
            <a href="#">Home</a>
          </li>

          <li>
            <a href="#">Menu</a>
          </li>

          <li>
            <a href="#">Service</a>
          </li>

          <li>
            <a href="#">About us</a>
          </li>

          <li>
            <a href="#">Contacts</a>
          </li>
          
          <li>
            <a href="#" class="btn">
              Sign in
              &nbsp;
              <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </a>
          </li>

        </ul>
      </nav>
    </header>

    <!-- section part -->
    <main>
      <section>
        <div class="hero-setcion flex wrapper gap-4">
          <div class="content">
            <h1>
              Enjoy Your Delicious
              <span>Food</span>
            </h1>
            <p class="para">
              We will fill your tummy with delicious <br> food with fast delivery.
            </p>
            <div class="flex gap-2">
              <a href="#" class="btn">Order now</a>
              <a href="#" class="social-icons">
                <i class="fa-brands fa-x-twitter"></i>
              </a>
              <a href="#" class="social-icons">
                <i class="fa-brands fa-instagram"></i>
              </a>
              <a href="#" class="social-icons">
                <i class="fa-brands fa-google-plus-g"></i>
              </a>
              <a href="#" class="social-icons">
                <i class="fa-brands fa-facebook"></i>
              </a>
            </div>

          </div>

          <div class="image-container">
            <img src="./images/delivery-boy.png" alt="">
          </div>
          <!-- 1:02:23 -->
        </div>

        
      </section>
    </main>

    <!-- footer bart -->
    <footer>

    </footer>

</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - GooFoodoo</title>
    <link rel="icon" href="../images/logo.webp" />
    <link rel="stylesheet" href="../CSS/checkOut.css" />
    <script defer src="../Javascript/checkOut.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <a href="../index.html" id="backBtn" class="btn">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
      Back
    </a>
    <div class="checkout-container">
      <!-- step bar -->
      <div class="steps">
        <div class="step active" data-step="0">
          <div class="step-icon">
            <i class="fa-solid fa-cart-shopping"></i>
            <p>Cart</p>
          </div>
        </div>
        <div class="line"></div>

        <div class="step" data-step="1">
          <div class="step-icon">
            <i class="fa-solid fa-location-dot"></i>
            <p>Address</p>
          </div>
        </div>
        <div class="line"></div>

        <div class="step" data-step="2">
          <div class="step-icon">
            <i class="fa-solid fa-credit-card"></i>
            <p>Payment</p>
          </div>
        </div>
        <div class="line"></div>

        <div class="step" data-step="3">
          <div class="step-icon">
            <i class="fa-solid fa-receipt"></i>
            <p>Preview</p>
          </div>
        </div>
      </div>

      <!-- pages -->
      <div class="page active" id="page-0">
        <!-- shopping cart page -->
        <h2 class="page-title">Your Shopping Cart</h2>
        <div class="cart-layout">
          <div class="cart-items" id="cartItems">
            <!--  -->
          </div>

          <div class="cart-summary">
            <h3>Order Summary</h3>
            <div class="summary-row">
              <span>Subtotal</span>
              <span id="subtotal">$0.00</span>
            </div>

            <div class="summary-row">
              <span>Delivery</span>
              <span id="deliveryFee">$0.5</span>
            </div>

            <div class="summary-row">
              <span>Total</span>
              <span id="total">$0.00</span>
            </div>
          </div>
          <div class="nextBtn">
            <button onclick="gotoStep(1)">
              Continue to Address <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="page" id="page-1">
        <!-- delivery page -->
        <h2 class="page-title">Delivery Address</h2>
        <div class="form-grid">
          <div class="form-group full">
            <label for="">Full Name</label>
            <input type="text" id="fullName" placeholder="Fullname" />
          </div>

          <div class="form-group full">
            <label for="">Street Address</label>
            <input type="text" id="street" placeholder="Address" />
          </div>

          <div class="form-group full">
            <label for="">City</label>
            <input type="text" id="city" placeholder="City" />
          </div>

          <div class="form-group full">
            <label for="">Postal Code</label>
            <input type="text" placeholder="Postal Code" />
          </div>

          <div class="form-group full">
            <label for="">Phone number</label>
            <input
              type="tel"
              id="phone"
              placeholder="+855 12345678"
              maxlength="15"
            />
          </div>

          <div class="form-group full">
            <label for="">Delivery Notes (Optional)</label>
            <textarea
              name=""
              id="notes"
              rows="2"
              placeholder="Gate code, Landmark"
            ></textarea>
          </div>
        </div>

        <div class="btn-row">
          <div class="prevBtn" onclick="gotoStep(0)">
            <button><i class="fa-solid fa-arrow-left"></i>Back</button>
          </div>
          <div class="nextBtn" onclick="gotoStep(2)">
            <button>
              Continue to Payment<i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="page" id="page-2">
        <!-- Payment Page -->
        <h2 class="page-title">Payment Method</h2>
        <div class="payment-wrapper">
          <div class="payment-methods">
            <div class="method active" data-method="card">
              <i class="fa-brands fa-cc-visa"></i>
              <p>Card</p>
            </div>

            <div class="method" data-method="payPal">
              <i class="fa-brands fa-paypal"></i>
              <p>Paypal</p>
            </div>

            <div class="method" data-method="cash">
              <i class="fa-solid fa-money-bill-wave"></i>
              <p>Cash</p>
            </div>
          </div>
          <div class="payment-form" id="cardForm">
            <div class="form-group">
              <label>Card Number</label>
              <input type="text" placeholder="ACCT-000035" maxlength="19" />
            </div>
            <div class="small-input">
              <div class="form-group">
                <label>Expiry</label>
                <input type="text" placeholder="MM/YY" maxlength="5" />
              </div>
              <div class="form-group">
                <label>CVV</label>
                <input type="text" placeholder="123" maxlength="4" />
              </div>
            </div>
          </div>
        </div>
        <div class="btn-row">
          <div class="prevBtn" onclick="gotoStep(1)">
            <button><i class="fa-solid fa-arrow-left"></i>Back</button>
          </div>
          <div class="nextBtn" onclick="gotoStep(3)">
            <button>
              Continue to Review Order<i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="page" id="page-3">
        <!-- preview -->
        <h2 class="page-title">Order Preview</h2>
        <div class="preview-layout">
          <div class="preview-section">
            <h3><i class="fa-solid fa-utensils"></i>Items</h3>
            <div id="previewItems"></div>
          </div>

          <div class="preview-section">
            <h3><i class="fa-solid fa-location-dot"></i> Delivery</h3>
            <p id="previewAddress"></p>
          </div>

          <div class="preview-section">
            <h3><i class="fa-solid fa-credit-card"></i> Payment</h3>
            <div id="previewPayment">Card</div>
          </div>

          <div class="preview-total">
            <span>Total to pay</span>
            <strong id="previewTotal">$0.00</strong>
          </div>
        </div>

        <div class="btn-row">
          <div class="prevBtn" onclick="gotoStep(2)">
            <button><i class="fa-solid fa-arrow-left"></i>Back</button>
          </div>
          <div class="confirm-btn" id="placeOrderBtn">
            <button><i class="fa-solid fa-check"></i>Place Order</button>
          </div>
        </div>
      </div>
    </div>

    <!-- pop up msg -->
    <div class="success-modal" id="successModal">
      <div class="success-content">
        <div class="checkmark-circle">
          <div class="checkmark"></div>
        </div>

        <h2>Ordered Successfully</h2>
        <p>Thanks you for choosing GooFoodoo💖</p>
        <button class="success-btn" id="successBtn">Okay</button>
      </div>
    </div>
  </body>
</html>

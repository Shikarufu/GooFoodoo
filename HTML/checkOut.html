<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment</title>
    <link rel="icon" href="../images/logo.webp" />
    <link rel="stylesheet" href="../CSS/checkOut.css" />
  </head>
  <body>
    <div class="checkout-container">
      <!-- step bar -->
      <div class="steps">
        <div class="step-active">
          <span>🛒</span>
          <p>Shopping Cart</p>
        </div>
        <div class="line"></div>

        <div class="step-active">
          <span>📍</span>
          <p>Delivery Address</p>
        </div>
        <div class="line"></div>
        
        <div class="step-active">
          <span>💳</span>
          <p>Payment</p>
        </div>
        <div class="line"></div>
        
        <div class="step-active">
          <span>📄</span>
          <p>Preview Order</p>
        </div>
        
      </div>
    </div>
  </body>
</html>

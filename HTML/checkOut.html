<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment</title>
    <link rel="icon" href="../images/logo.webp" />
    <link rel="stylesheet" href="../CSS/checkOut.css" />
    <script defer src="../Javascript/checkOut.js"></script>
  </head>
  <body>
    <a href="../index.html" id="backBtn" class="btn">
      <svg
        xmlns="http://w3.org"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
      Back
    </a>
    <div class="checkout-container">
      <!-- step bar -->
      <div class="steps">
        <div class="step active" data-step="0">
          <span>🛒</span>
          <p>Shopping Cart</p>
        </div>
        <div class="line"></div>

        <div class="step " data-step="1">
          <span>📍</span>
          <p>Delivery Address</p>
        </div>
        <div class="line"></div>

        <div class="step" data-step="2">
          <span>💳</span>
          <p>Payment</p>
        </div>
        <div class="line"></div>

        <div class="step" data-set="3">
          <span>📄</span>
          <p>Preview Order</p>
        </div>
      </div>

      <!-- pages -->
       <div class="page active" id="shopPage">
          Shopping page 
          <span id="msg"></span>
          <button onclick="gotoStep(1)">continue</button>
       </div>
       <div class="page " id="deliveryPage">
          Delivery Address
          <button onclick="gotoStep(2)">continue</button>
       </div>
       <div class="page " id="paymentPage">
          Payment Page
          <button onclick="gotoStep(3)">continue</button>
       </div>
       <div class="page " id="previewPage">
          Receipt Content
          <!-- <button onclick="generateReceipt()">receipt</button> -->
       </div>
  </body>
</html>

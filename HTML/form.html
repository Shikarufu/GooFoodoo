<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="stylesheet" href="../CSS/form.css" />
    <link rel="icon" href="../images/logo.webp" />
    <script defer src="../Javascript/form.js"></script>
  </head>
  <body>
    <div class="container">
      
      <!-- <button  id="backBtn"  class="btn"> -->
        <a href="../index.html" id="backBtn" class="btn">
            <svg
            xmlns="http://w3.org"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
          Back
        </a>
      <!-- </button> -->
      <!-- this is for image -->
      <div class="left-side">
        <img src="../images/burger.webp" alt="burger" />
      </div>

      <!-- this is for form -->
      <div class="right-side">
        <div class="form-container">
          <h1>Create Account</h1>
          <label for="">
            <input type="text" placeholder="Name" autocomplete="off" />
          </label>
          <label for="">
            <input type="email" placeholder="Email" autocomplete="off" />
          </label>
          <label for="">
            <input type="password" placeholder="Password" autocomplete="off" />
          </label>
          <label for="">
            <input
              type="password"
              placeholder="Confirm Password"
              autocomplete="off"
            />
          </label>
        </div>
        <div class="check-box">
          <input type="checkbox" autocomplete="off" />

          <span> I agree terms & condition </span>
        </div>

        <button class="signUp" id="signUp">Sign Up</button>
        <p>Already have an account? <a href="">Sign in</a> Here</p>

        <!-- for pop up -->
        <div class="popUp" id="popUp">
          <h3>✅ Success!</h3>
          <p>Your account has been created.</p>
          <button class="okBtn" id="okBtn">
            Okay
          </button>
        </div>
      </div>
    </div>
  </body>
</html>

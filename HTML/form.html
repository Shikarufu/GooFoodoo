<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="stylesheet" href="../CSS/form.css" />
    <link rel="icon" href="../images/logo.webp" />
    <script defer src="../Javascript/form.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- <button  id="backBtn"  class="btn"> -->
      <a href="../index.html" id="backBtn" class="btn">
        <svg
          xmlns="http://w3.org"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m15 18-6-6 6-6" />
        </svg>
        Back
      </a>
      <!-- </button> -->
      <!-- this is for image -->
      <div class="left-side">
        <img src="../images/burger.webp" alt="burger" />
      </div>

      <!-- this is for form -->
      <div class="right-side">
        <div class="form-container">
          <h1>Create Account</h1>
          <!-- <label for=""> -->
          <input
            class="data"
            type="text"
            id="name"
            placeholder="Name"
            autocomplete="off"
          />
          <!-- </label> -->
          <!-- <label for=""> -->

          <input
            class="data"
            type="email"
            id="email"
            placeholder="Email"
            autocomplete="off"
          />

          <!-- </label> -->
          <!-- <br> -->
          <!-- <span id="pwMsg"></span> -->
          <!-- <label for=""> -->
          <div class="input-group">
            <input
              class="data"
              onkeyup="checkPw()"
              style="margin-top: 0.5rem; margin-bottom: 5px"
              type="password"
              id="password"
              placeholder="Password"
              autocomplete="off"
            />
            <span id="pwMsg"></span>
          </div>

          <!-- </label>
          <label for=""> -->
          <!-- <br> -->
          <div class="input-group">
            <input
              class="data"
              onkeyup="checkPw()"
              style="margin-top: 0.5rem; margin-bottom: 5px"
              type="password"
              id="confirmPassword"
              placeholder="Confirm Password"
              autocomplete="off"
            />
            <span id="CfPwMsg"></span>
          </div>

          <!-- <small id="msg"></small> -->
          <!-- </label> -->
        </div>
        <div class="check-box">
          <input type="checkbox" autocomplete="off" />

          <span> I agree terms & condition </span>
        </div>

        <button class="signUp" id="signUp">Sign Up</button>
        <p>Already have an account? <a href="">Sign in</a> Here</p>

        <!-- message for telling user the problem -->
        <!-- error -->
         <!--  -->
        <div class="popUp" id="errorPopUp">
          <h3>⚠️ Warning!</h3>
          <p style="margin-bottom:.2rem;">Please try again!</p>
          <p style="margin-top:.2rem;">Input can not be empty!</p>
          <button class="okBtn" id="okBtnError">Okay</button>
        </div>
        <!-- for pop up -->
        <div class="popUp" id="popUp">
          <h3 id="msg1">✅ Success!</h3>
          <p id="msg2">Your account has been created.</p>
          <button class="okBtn" id="okBtn">Okay</button>
        </div>
      </div>
    </div>
  </body>
</html>

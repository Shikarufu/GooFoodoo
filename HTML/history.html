<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GooFoodoo | History</title>
    <link rel="icon" href="../images/logo.webp" />
    <link rel="stylesheet" href="../CSS/history.css" />
    <script defer src="../Javascript/history.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <a href="../index.html" id="backBtn" class="btn">
      <svg
        xmlns="http://w3.org"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
      Back
    </a>

    <div class="container">
      <div class="header">
        <h2>Transaction History <i class="fa-solid fa-money-bill-transfer"></i></h2>
        <div class="stats">
          <div class="stat-box">
            <h3 id="totalOrder">
              0
            </h3>
            <p>Total Orders</p>
          </div>

          <div class="stat-box">
            <h3 id="totalSpent">
              $ 0
            </h3>
            <p>Total Spent</p>
          </div>
        </div>
        
      </div>

      <div id="historyContainer" class="history-list"></div>
        <!-- Dynamic transactions will load here -->
      
      <div class="receipt-modal" id="receiptModal">
        <div class="receipt-content">
          <button id="closeReceipt">
            X
          </button>

          <div class="receiptBody"></div>
        </div>
      </div>
    </div>
  </body>
</html>
